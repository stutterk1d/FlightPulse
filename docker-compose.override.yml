x-airflow-image: &airflow-image
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src         
    - ./models:/opt/airflow/models   
    - ./.env:/opt/airflow/.env:ro    
    - ./reports:/opt/airflow/reports  
  environment:
    PYTHONPATH: /opt/airflow
    MLFLOW_TRACKING_URI: http://mlflow:5000
    FLIGHTPULSE_DB_HOST: flightpulse-db
    FLIGHTPULSE_DB_PORT: "5432"

services:
  # Application database
  flightpulse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"          # host 5433 avoids clashing with postgres
    volumes:
      - flightpulse-db-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  serve:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./.env:/app/.env:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FLIGHTPULSE_DB_HOST: flightpulse-db
      FLIGHTPULSE_DB_PORT: "5432"
    depends_on:
      flightpulse-db:
        condition: service_healthy
      mlflow:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports:ro
      - ./.env:/app/.env:ro
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FLIGHTPULSE_DB_HOST: flightpulse-db
      FLIGHTPULSE_DB_PORT: "5432"
      FLIGHTPULSE_API: http://serve:8000
      FLIGHTPULSE_REPORTS: /app/reports
    depends_on:
      flightpulse-db:
        condition: service_healthy
      serve:
        condition: service_started
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@flightpulse-db:5432/mlflow
      --artifacts-destination /mlartifacts
      --serve-artifacts
      --allowed-hosts "mlflow:*,localhost:*,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      flightpulse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-image
  airflow-scheduler:
    <<: *airflow-image
  airflow-dag-processor:
    <<: *airflow-image
  airflow-worker:
    <<: *airflow-image
  airflow-triggerer:
    <<: *airflow-image
  airflow-init:
    <<: *airflow-image

volumes:
  flightpulse-db-data:
  mlflow-artifacts: